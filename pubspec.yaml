name: guitar_bridge
description: 跨平台吉他练耳训练工具 - 相对音准识别与指板训练
version: 3.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^3.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/samples/guitar/
