name: guitar_bridge
description: 跨平台吉他练耳训练工具 - 相对音准识别与指板训练
version: 3.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^3.2.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.2
  path_provider: ^2.1.6
  flutter_haptics: ^1.0.0
  confetti_widget: ^0.4.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.0
  provider: ^6.1.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
