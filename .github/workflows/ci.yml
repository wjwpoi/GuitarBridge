name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Quality and six-platform build
    uses: ./.github/workflows/build.yml

  deploy-web:
    name: Deploy Web to GitHub Pages
    # Only builds that passed every quality gate and platform build on main
    # are published.
    needs: quality-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download verified Web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guitarbridge-web
          path: artifact

      - name: Prepare site for the Pages sub-path
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          unzip -q artifact/guitarbridge-web.zip -d site-root
          site=site-root/web
          # Pages serves the app under /<repo>/, not the domain root.
          sed -i "s#<base href=\"/\">#<base href=\"/${REPO_NAME}/\">#" "$site/index.html"
          sed -i "s#__GB_ORIGIN__#${SITE_ORIGIN}/${REPO_NAME}#g" "$site/index.html"
          grep -F "<base href=\"/${REPO_NAME}/\">" "$site/index.html"
          # Flutter routes are client-side; serve the app for unknown paths.
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site-root/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
