<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1D1B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="GuitarBridge 用真实吉他采样连接相对音准与等宽指板训练，打开浏览器即可练习。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GuitarBridge · 听见音程，看懂指板">
  <meta property="og:description" content="真实吉他采样、相对音准训练与等宽指板，在任意设备的浏览器中直接练习。">
  <meta property="og:image" content="__GB_ORIGIN__/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GuitarBridge · 听见音程，看懂指板">
  <meta name="twitter:description" content="真实吉他采样、相对音准训练与等宽指板，在任意设备的浏览器中直接练习。">
  <meta name="twitter:image" content="__GB_ORIGIN__/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GuitarBridge">
  <link rel="apple-touch-icon" href="icons/GuitarBridge-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="guitarbridge-favicon.png"/>

  <title>GuitarBridge · 吉他音程与指板训练</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --gb-canvas: #faf9f5;
      --gb-text: #1f1e1b;
      --gb-muted: #8f8b82;
      --gb-accent: #c6613f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --gb-canvas: #1e1d1b;
        --gb-text: #edebe5;
        --gb-muted: #8c887f;
        --gb-accent: #db7c5a;
      }
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--gb-canvas);
    }

    body {
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    #gb-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      color: var(--gb-text);
      background: var(--gb-canvas);
      transition: opacity 200ms ease;
    }

    .gb-loading-copy { text-align: center; }
    .gb-loading-copy strong {
      display: block;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .gb-loading-copy span {
      display: block;
      margin-top: 10px;
      color: var(--gb-muted);
      font-size: 12px;
    }
    .gb-loading-bar {
      width: 120px;
      height: 2px;
      margin: 18px auto 0;
      overflow: hidden;
      border-radius: 2px;
      background: color-mix(in srgb, var(--gb-muted) 25%, transparent);
    }
    .gb-loading-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--gb-accent);
      animation: gb-slide 1.1s ease-in-out infinite;
    }
    @keyframes gb-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="gb-loading" role="status" aria-live="polite">
    <div class="gb-loading-copy">
      <strong>GuitarBridge</strong>
      <span>正在准备指板与吉他采样</span>
      <div class="gb-loading-bar" aria-hidden="true"></div>
    </div>
  </div>
  <noscript>GuitarBridge 需要启用 JavaScript 才能运行训练。</noscript>
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('gb-loading');
      if (!loader) return;
      loader.style.opacity = '0';
      window.setTimeout(() => loader.remove(), 180);
    });
  </script>
</body>
</html>
